<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06382c">
  <meta name="description" content="منوی آنلاین VERO Coffee & Roastery">
  <title>VERO Coffee — QR Menu</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#032e24}
    body{display:flex;justify-content:center}
    .menu{position:relative;width:min(100%,1024px);line-height:0;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.42)}
    .menu-image{display:block;width:100%;height:auto}
    .logo-replacement{position:absolute;z-index:2;left:2.9%;top:2.45%;width:24.2%;height:7.5%;display:grid;place-items:center;background:linear-gradient(90deg,#063a2e 0%,#073b2f 82%,rgba(7,59,47,.96) 100%)}
    .logo-replacement img{display:block;width:94%;height:94%;object-fit:contain;filter:brightness(0) invert(88%) sepia(18%) saturate(490%) hue-rotate(352deg) brightness(94%) contrast(90%)}
    @media(max-width:520px){.menu{width:100%}}
  </style>
</head>
<body>
  <main class="menu" aria-label="منوی کافه VERO">
    <img class="menu-image" src="assets/vero-menu-original.png" alt="منوی کامل VERO Coffee">
    <div class="logo-replacement" aria-label="لوگوی VERO Coffee Shop">
      <img src="assets/vero-pvc-logo-hd.webp" alt="VERO Coffee Shop">
    </div>
  </main>
</body>
</html>
